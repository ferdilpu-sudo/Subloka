name: T10 Engine Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/asr/**"
      - "engine/translation/**"
      - "tools/t10_wer.py"
      - "tools/t10_device_benchmark.ps1"
      - "tools/t10_asr_stability.ps1"
      - "tools/test_t10_asr_stability_adb.ps1"
      - "tools/test_t10_asr_remote_exit.ps1"
      - "tools/t10_asr_error_audit.py"
      - "tools/test_t10_asr_error_audit.py"
      - "tools/t10_translation_device_benchmark.ps1"
      - "tools/t10_translation_review.py"
      - "tools/test_t10_translation_review.py"
      - "tools/t10_prepare_dataset.ps1"
      - "tools/t10_fetch_fleurs_dataset.py"
      - "tools/t10_build_android_whisper.sh"
      - "tools/t10_dataset.example.json"
      - ".github/workflows/t10-engine-eval.yml"

permissions:
  contents: read

jobs:
  whisper-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify pinned multilingual Whisper models
        shell: bash
        run: |
          set -euo pipefail
          REV="80da2d8bfee42b0e836fc3a9890373e5defc00a6"
          mkdir -p "$RUNNER_TEMP/whisper-models"
          cd "$RUNNER_TEMP/whisper-models"

          curl -L --fail --retry 3 -o ggml-tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/$REV/ggml-tiny.bin?download=true"
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" | sha256sum -c -

          curl -L --fail --retry 3 -o ggml-base.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/$REV/ggml-base.bin?download=true"
          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  ggml-base.bin" | sha256sum -c -

          {
            echo "## Whisper model artifacts"
            echo
            stat --printf="- %n: %s bytes\n" ggml-tiny.bin ggml-base.bin
            echo "- Source model revision: $REV"
            echo "- whisper.cpp engine candidate: v1.9.4"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install synthetic-speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Run whisper.cpp bilingual synthetic smoke
        shell: bash
        run: |
          bash tools/t10_whisper_synthetic_smoke.sh \
            "$RUNNER_TEMP/whisper-models" \
            "$RUNNER_TEMP/whisper-smoke"
          cat "$RUNNER_TEMP/whisper-smoke/summary.md" >> "$GITHUB_STEP_SUMMARY"

  translation-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download ML Kit models and run EN-ID translation smoke
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: ./gradlew --stacktrace :engine:translation:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.subloka.engine.translation.MlKitTranslationInstrumentedTest

  asr-adb-windows-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Regression test ADB stderr under Windows PowerShell 5.1
        shell: powershell
        run: .\tools\test_t10_asr_stability_adb.ps1

  android-benchmark-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate FLEURS dataset fetcher syntax
        shell: bash
        run: python -m py_compile tools/t10_fetch_fleurs_dataset.py

      - name: Validate dataset preparation script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/t10_prepare_dataset.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate PowerShell benchmark harness syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/t10_device_benchmark.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate PowerShell ASR stability harness syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/t10_asr_stability.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test Android-style Whisper exit marker using POSIX shell
        shell: pwsh
        run: ./tools/test_t10_asr_remote_exit.ps1

      - name: Validate PowerShell translation harness syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/t10_translation_device_benchmark.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test ASR error audit evaluator
        shell: bash
        run: python -m unittest discover -s tools -p test_t10_asr_error_audit.py

      - name: Test translation quality review evaluator
        shell: bash
        run: python -m unittest discover -s tools -p test_t10_translation_review.py

      - name: Install pinned Android NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cross-compile whisper-cli for arm64 Android
        shell: bash
        run: |
          bash tools/t10_build_android_whisper.sh "$RUNNER_TEMP/t10-android"
