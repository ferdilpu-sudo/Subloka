name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-wrapper.yml"

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Commit wrapper files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already up to date."
            exit 0
          fi
          git commit -m "build: add Gradle wrapper 9.6"
          git push
