name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "README.md"
      - "FILELIST.txt"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBLOKA_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Initial sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Updated sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate project guardrails
        run: python3 tools/validate_project.py

      - name: Signing verifier regression tests
        run: python3 tools/test_prototype_signing.py

      - name: Instrumentation log verifier regression tests
        run: python3 tools/test_instrumentation_result.py

      - name: Domain unit tests
        run: ./gradlew --stacktrace :core:domain:testDebugUnitTest

      - name: Database integration tests
        run: ./gradlew --stacktrace :core:database:testDebugUnitTest

      - name: Media unit tests
        run: ./gradlew --stacktrace :core:media:testDebugUnitTest

      - name: ASR model-store unit tests
        run: ./gradlew --stacktrace :engine:asr:testDebugUnitTest

      - name: Translation pipeline and fidelity unit tests
        run: ./gradlew --stacktrace :engine:translation:testDebugUnitTest

      - name: Compile translation device tests
        run: ./gradlew --stacktrace :engine:translation:assembleDebugAndroidTest

      - name: Compile media device tests
        run: ./gradlew --stacktrace :core:media:assembleDebugAndroidTest

      - name: Compile real-video app media diagnostic tests
        run: ./gradlew --stacktrace :app:assembleDebugAndroidTest

      - name: Verify Room schema fixture
        shell: bash
        run: |
          git diff --exit-code -- core/database/schemas
          test -z "$(git status --porcelain -- core/database/schemas)"

      - name: Assemble debug
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Lint debug
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subloka-ci-test-only-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html

  media-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run media tests on Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            bash tools/run_media_device_tests.sh
            ./gradlew --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.subloka.NativeAsrLoadingTest,app.subloka.TranslationAdapterLoadingTest,app.subloka.SrtDocumentWriterTest,app.subloka.EditorLayoutTest,app.subloka.TranslationRecoveryUiTest,app.subloka.AsrForegroundServiceTest,app.subloka.TranslationForegroundServiceTest,app.subloka.RenderForegroundServiceTest,app.subloka.VideoExportSaveTest,app.subloka.SourceRelinkUiTest

  modern-services:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test services with notification permission granted and denied on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash tools/run_modern_service_tests.sh

      - name: Upload modern service test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-service-test-logs
          path: app/build/modern-service-tests/
          if-no-files-found: warn

  stable-prototype-apk:
    # Never expose the signing secret to pull_request runs, including same-repo PRs.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/t11-offline-asr-prototype'
    needs: [build, media-device, modern-services]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: subloka-ci-test-only-and-reports
          path: unsigned-input
      - name: Sign and verify owner-key APK
        env:
          SUBLOKA_PROTOTYPE_SIGNING: ${{ secrets.SUBLOKA_PROTOTYPE_SIGNING }}
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "build-tools;37.0.0"
          APK="$(find unsigned-input -name app-debug.apk -type f)"
          test -f "$APK"
          python3 tools/prototype_signing.py sign --apk "$APK" --output stable-apk/subloka-prototype.apk --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: subloka-stable-prototype-apk
          path: stable-apk/
          if-no-files-found: error
