name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "README.md"
      - "FILELIST.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Initial sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Updated sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate project guardrails
        run: python3 tools/validate_project.py

      - name: Domain unit tests
        run: ./gradlew --stacktrace :core:domain:testDebugUnitTest

      - name: Database integration tests
        run: ./gradlew --stacktrace :core:database:testDebugUnitTest

      - name: Media unit tests
        run: ./gradlew --stacktrace :core:media:testDebugUnitTest

      - name: ASR model-store unit tests
        run: ./gradlew --stacktrace :engine:asr:testDebugUnitTest

      - name: Compile translation device tests
        run: ./gradlew --stacktrace :engine:translation:assembleDebugAndroidTest

      - name: Compile media device tests
        run: ./gradlew --stacktrace :core:media:assembleDebugAndroidTest

      - name: Verify Room schema fixture
        shell: bash
        run: |
          git diff --exit-code -- core/database/schemas
          test -z "$(git status --porcelain -- core/database/schemas)"

      - name: Assemble debug
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Lint debug
        run: ./gradlew --stacktrace :app:lintDebug


  media-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run media tests on Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash tools/run_media_device_tests.sh
