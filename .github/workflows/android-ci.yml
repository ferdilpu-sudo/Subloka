name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 17 preview SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Initial sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Updated sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          "$SDKMANAGER" --list --channel=3 | grep -E "platforms;android-37|build-tools;37" || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate project guardrails
        run: python3 tools/validate_project.py

      - name: Assemble debug
        run: gradle --stacktrace :app:assembleDebug

      - name: Lint debug
        run: gradle --stacktrace :app:lintDebug
